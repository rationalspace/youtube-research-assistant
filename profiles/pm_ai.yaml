channels:
  - url: "https://www.youtube.com/@theskippodcast"
    handle: "@theskippodcast"
  - url: "https://www.youtube.com/@PeterYangYT"
    handle: "@PeterYangYT"
  - url: "https://www.youtube.com/@MaheshAIPMCommunity"
    handle: "@MaheshAIPMCommunity"

videos_per_channel: 2
enable_reading_queue: true

prompt: |
  Summarize this product management / AI video for a senior product leader.
  Use the exact format below — bullet points throughout, no prose paragraphs.

  **[One sentence: what the video argues or teaches, written as a direct claim]**

  **Key Insights**
  - [Specific insight, finding, or argument — one line each]
  - [Include concrete details: tool names, numbers, framework names where mentioned]
  - [3–5 bullets depending on how rich the content is; skip filler]

  **Frameworks & Tools**
  - [Name] — [one-line explanation of what it is or why it matters]
  - [Only include if the video actually introduces or explains something specific; omit this section entirely if there are none]

  **Action This Week**
  - [The single most concrete thing worth doing or investigating based on this video]
  - [Add a second bullet only if there is a genuinely distinct second action — do not pad]

  Rules:
  - Every line under a heading must start with "- " (a dash and space)
  - Use **bold** only for proper tool/framework names inline, not for emphasis
  - No numbered lists, no markdown headers (##), no [TAG] annotations
  - If the video is low-substance (short clip, promo, generic advice), write the TL;DR line and then a single bullet under Key Insights saying so — skip the other sections

  Video: {title}
  Channel: {channel}

  Transcript:
  {transcript}

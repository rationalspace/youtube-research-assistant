channels:
  - url: "https://www.youtube.com/@parkevtatevosiancfa9544"
    handle: "@parkevtatevosiancfa9544"
  - url: "https://www.youtube.com/@AkshatZayn"
    handle: "@AkshatZayn"
  - url: "https://www.youtube.com/@TickerSymbolYOU"
    handle: "@TickerSymbolYOU"

videos_per_channel: 2
enable_reading_queue: false

prompt: |
  Summarize this investment / finance video. Be direct and specific — no filler phrases.
  Use the exact bullet-point format below.

  **[Ticker(s): SYMBOL1, SYMBOL2] — [Buy / Sell / Hold / Bullish / Bearish / Neutral] — [one-line thesis]**

  **Tickers & Prices**
  - [TICKER] — [current price if mentioned] / [price target if mentioned] / [entry point if mentioned]
  - [Only list tickers the video actually discusses in depth; skip passing mentions]

  **The Thesis**
  - [Core argument for or against this stock — specific, not generic]
  - [Key catalyst, risk, or data point driving the view]
  - [Any valuation metric, earnings detail, or competitive factor cited]

  **Rating**
  - [Explicit Buy/Sell/Hold if stated, OR the creator's clear sentiment: Bullish / Bearish / Cautious / Mixed]
  - [One sentence on why — what would change their view]

  **Worth Acting On?**
  - [Yes / No / Watch] — [one sentence: what to do or monitor, e.g. "Add to watchlist and check Q3 earnings", "Already own — no new action needed", "Skip — thesis depends on macro assumptions"]

  Rules:
  - Every line under a heading must start with "- "
  - Use **TICKER** bold for stock symbols inline where helpful
  - No product leader framing, no generic advice, no "as an investor you should..."
  - If the video covers multiple unrelated stocks, repeat the Tickers & Prices / Thesis / Rating block for each
  - If the video has no specific tickers or price data (e.g. pure macro commentary), say so in the header line and summarise the macro view in The Thesis section

  Video: {title}
  Channel: {channel}
  Published: {published}

  Transcript:
  {transcript}
